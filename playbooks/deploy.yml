---

# Main Ansible playbook to run configuration of servers in inventory

- name: Configure m710q server
  hosts: homelabian-m710q
  become: true

  vars:
    docker_volumes_storage_path: /raid/docker_volumes
    tailscale_serve_services: {}  # Services exposed to Tailscale, filled in by service roles

  # Setup various services via roles
  roles:
    # General setup
    - role: common-mini
    - role: mdadm_array
    - role: docker

    # Docker services
    - role: actual_budget
    - role: frigate
    - role: homarr
    - role: watchtower
    - role: tailscale_serve

    # Baremetal services
    # - role: borgmatic
