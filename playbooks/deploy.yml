---

# Deploy services to the server(s)

- name: Configure m710q server
  hosts: homelabian-m710q
  become: true

  vars:
    tailscale_serve_services: {}  # Services exposed to Tailscale, filled in by service roles
    docker_volumes_storage_path: /raid/docker_volumes

  # Setup various services via roles
  roles:
    # General setup
    - role: common-mini
    - role: tailscale_exit_node
    - role: docker

    # Docker services
    - role: actual_budget
    - role: frigate
    - role: homarr
    - role: obsidian_livesync
    - role: home_assistant
    - role: watchtower

    # Baremetal services
    - role: borgmatic
      borgmatic_repository_path: /raid/backups/borg
      borgmatic_source_directories:
        - /home
        - "{{ docker_volumes_storage_path }}"

    # Serve all services via Tailscale
    - role: tailscale_serve
