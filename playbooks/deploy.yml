---

# Deploy services to the server(s)

- name: Configure pi3b off-site backup server
  hosts: homelabian-pi3b
  become: true

  roles:
    - role: common-mini
    - role: borg_backup_server

- name: Configure m710q server
  hosts: homelabian-m710q
  become: true

  vars:
    tailscale_serve_services: {}  # Services exposed to Tailscale, filled in by service roles
    docker_volumes_storage_path: /raid/docker_volumes

  # Setup various services via roles
  roles:
    # General setup
    - role: common-mini
    - role: tailscale_exit_node
    - role: docker

    # Docker services
    - role: immich
    - role: actual_budget
    - role: frigate
    - role: homarr
    - role: obsidian_livesync
    - role: home_assistant
    - role: watchtower

    # Baremetal services
    - role: borgmatic
      borgmatic_source_directories:
        - /home
        - "{{ docker_volumes_storage_path }}"
      borgmatic_exclude_patterns:
        - "{{ docker_volumes_storage_path }}/frigate_media"
        - "{{ docker_volumes_storage_path }}/immich_cache"
        - "{{ docker_volumes_storage_path }}/immich_data/_data/encoded-video"
        - "{{ docker_volumes_storage_path }}/immich_data/_data/thumbs"

    # Serve all services via Tailscale
    - role: tailscale_serve
