---
# Set the system hostname on a newly flashed server

- name: Set the new systemd hostname
  ansible.builtin.hostname:
    name: "{{ provision_hostname_hostname }}"

- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ provision_hostname_hostname }}"
    owner: root
    group: root
    mode: '0644'
