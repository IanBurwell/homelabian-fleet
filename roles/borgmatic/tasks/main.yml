---
# Tasks to deploy borgmatic backup service

- name: Deploy borgmatic
  block:
    - name: Require borgmatic encryption passphrase
      ansible.builtin.assert:
        that:
          - borgmatic_encryption_passphrase is string
          - borgmatic_encryption_passphrase | length > 0
        fail_msg: Set borgmatic_encryption_passphrase to a Vault-encrypted value.

    - name: Install borgmatic and openssh-client packages
      ansible.builtin.package:
        name:
          - borgmatic
          - openssh-client
        state: present

    - name: Ensure borgmatic and root SSH directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ borgmatic_config_dir }}"
          mode: '0755'
        - path: "{{ borgmatic_cache_dir }}"
          mode: '0755'
        - path: "{{ borgmatic_log_dir }}"
          mode: '0755'
        - path: "{{ borgmatic_ssh_key_path | dirname }}"
          mode: '0700'

    - name: Generate dedicated Borg SSH keypair for root if missing
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -f
          - "{{ borgmatic_ssh_key_path }}"
          - -N
          - ""
          - -C
          - "borgmatic@{{ inventory_hostname }}"
        creates: "{{ borgmatic_ssh_key_path }}"
      when: not ansible_check_mode

    - name: Check whether Borg SSH public key exists
      ansible.builtin.stat:
        path: "{{ borgmatic_ssh_key_path }}.pub"
      register: borgmatic_ssh_pubkey_stat

    - name: Read Borg SSH public key
      ansible.builtin.slurp:
        src: "{{ borgmatic_ssh_key_path }}.pub"
      register: borgmatic_ssh_pubkey_raw
      when: borgmatic_ssh_pubkey_stat.stat.exists

    - name: Authorize Borg SSH public key on remote backup server
      ansible.posix.authorized_key:
        user: "{{ borg_backup_server_user }}"
        key: "{{ borgmatic_ssh_pubkey_raw.content | b64decode | trim }}"
        key_options: >-
          command="sh -c 'borg serve --restrict-to-path {{ borg_backup_repo_path }};
          rc=$?;
          curl -fsS -m 5 http://127.0.0.1:{{ borg_backup_server_status_port | default(9101) }}/?refresh=1 >/dev/null 2>&1 || true;
          exit $rc'",restrict
        state: present
      delegate_to: "{{ borg_backup_server_host }}"
      when: borgmatic_ssh_pubkey_stat.stat.exists

    # `borg init` refuses to touch an existing repository, so treat "already exists" as success.
    - name: Initialize Borg repository if needed
      ansible.builtin.command:
        argv:
          - borg
          - init
          - --encryption
          - "{{ borgmatic_repository_encryption }}"
          - "{{ borgmatic_repository_path }}"
      environment:
        BORG_PASSPHRASE: "{{ borgmatic_encryption_passphrase }}"
        BORG_RSH: "{{ borgmatic_ssh_command }}"
      register: borgmatic_repo_init
      changed_when: borgmatic_repo_init.rc == 0
      failed_when:
        - borgmatic_repo_init.rc != 0
        - "'already exists' not in borgmatic_repo_init.stderr"
      no_log: true
      when: not ansible_check_mode

    - name: Deploy default borgmatic config
      ansible.builtin.template:
        src: borgmatic-config.yaml
        dest: "{{ borgmatic_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: '0600'

    - name: Deploy borgmatic systemd service
      ansible.builtin.template:
        src: borgmatic.service
        dest: /etc/systemd/system/borgmatic.service
        owner: root
        group: root
        mode: '0644'
      register: borgmatic_service

    - name: Deploy borgmatic systemd timer
      ansible.builtin.template:
        src: borgmatic.timer
        dest: /etc/systemd/system/borgmatic.timer
        owner: root
        group: root
        mode: '0644'
      register: borgmatic_timer

    - name: Reload systemd if service/timer changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - not ansible_check_mode
        - borgmatic_service.changed or borgmatic_timer.changed

    - name: Enable and start borgmatic timer
      ansible.builtin.systemd_service:
        name: borgmatic.timer
        state: started
        enabled: true
      when: not ansible_check_mode
