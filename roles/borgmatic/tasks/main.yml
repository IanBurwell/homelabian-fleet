---
# Tasks to deploy borgmatic backup service

- name: Deploy borgmatic
  block:
    - name: Require borgmatic repository path
      ansible.builtin.assert:
        that:
          - borgmatic_repository_path is defined and borgmatic_repository_path | string | length > 0
        fail_msg: Set borgmatic_repository_path to the Borg repository location.

    - name: Require borgmatic encryption passphrase
      ansible.builtin.assert:
        that:
          - borgmatic_encryption_passphrase is string
          - borgmatic_encryption_passphrase | length > 0
        fail_msg: Set borgmatic_encryption_passphrase to a Vault-encrypted value.

    - name: Install borgmatic package
      ansible.builtin.package:
        name: borgmatic
        state: present

    - name: Ensure borgmatic directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ borgmatic_config_dir }}"
        - "{{ borgmatic_cache_dir }}"
        - "{{ borgmatic_log_dir }}"

    - name: Ensure borg repository parent directory exists
      ansible.builtin.file:
        path: "{{ borgmatic_repository_path | dirname }}"
        state: directory
        mode: '0700'

    - name: Initialize borg repository if needed
      ansible.builtin.command:
        argv:
          - borg
          - init
          - --encryption
          - "{{ borgmatic_repository_encryption }}"
          - "{{ borgmatic_repository_path }}"
        creates: "{{ borgmatic_repository_path }}/config"
      environment:
        BORG_PASSPHRASE: "{{ borgmatic_encryption_passphrase }}"
      # no_log: true
      when: not ansible_check_mode

    - name: Deploy default borgmatic config
      ansible.builtin.template:
        src: borgmatic-config.yaml
        dest: "{{ borgmatic_config_dir }}/config.yaml"
        mode: '0600'

    - name: Deploy borgmatic systemd service
      ansible.builtin.template:
        src: borgmatic.service
        dest: /etc/systemd/system/borgmatic.service
        mode: '0644'
      register: borgmatic_service

    - name: Deploy borgmatic systemd timer
      ansible.builtin.template:
        src: borgmatic.timer
        dest: /etc/systemd/system/borgmatic.timer
        mode: '0644'
      register: borgmatic_timer

    - name: Reload systemd if service/timer changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - not ansible_check_mode
        - borgmatic_service.changed or borgmatic_timer.changed

    - name: Enable and start borgmatic timer
      ansible.builtin.systemd_service:
        name: borgmatic.timer
        state: started
        enabled: true
      when: not ansible_check_mode
