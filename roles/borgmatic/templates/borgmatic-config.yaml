# Minimal borgmatic configuration template
# See https://torsion.org/borgmatic/docs/how-to/set-up-backups/

source_directories:
  - /home
  - /opt

repositories:
  - path: /mnt/backups/borg
    # label: local_backup

retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6

consistency:
  checks:
    - repository
    - archives

logging:
  level: info
