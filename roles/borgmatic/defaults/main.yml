---
# Default variables for borgmatic role

borgmatic_repository_encryption: repokey-blake2
borgmatic_encryption_passphrase: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          61393638303765643339316464393531636461333563343639333266333264643634656562313664
          3666303531346435353832376130376565393138323337350a383666333864653362396233643133
          33353861396666643731353166623930323164313337373666336538633162326236616363666262
          6565386334373038350a366430373730353762323464373434353332333462626264396630353861
          6633

borgmatic_config_dir: /etc/borgmatic.d
borgmatic_cache_dir: /var/cache/borg
borgmatic_log_dir: /var/log/borgmatic

# SSH configuration for the remote off-site Borg repository
borgmatic_ssh_key_path: /root/.ssh/id_ed25519_borg
borgmatic_ssh_command: "ssh -i {{ borgmatic_ssh_key_path }} -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
borgmatic_repository_path: "ssh://{{ borg_backup_server_user }}@{{ borg_backup_server_host }}.{{ tailnet_fqdn }}{{ borg_backup_repo_path }}"

# Directories included in backups
borgmatic_source_directories:
  - /home
  - /opt

borgmatic_exclude_patterns: []

# Weekly schedule (Sunday at 02:00 AM) to minimize drive wear while retaining archival copies
borgmatic_on_calendar: "Sun *-*-* 02:00:00"
borgmatic_keep_weekly: 4
borgmatic_keep_monthly: 6
borgmatic_keep_yearly: 1
borgmatic_check_frequency: "1 month"
