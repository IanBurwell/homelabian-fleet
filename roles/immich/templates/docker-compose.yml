---
name: immich

services:
  immich-server:
    container_name: immich_server
    image: "ghcr.io/immich-app/immich-server:{{ immich_version }}"
    depends_on:
      - redis
      - database
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: "{{ immich_db_password }}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      TZ: "{{ immich_timezone }}"
    volumes:
      - "immich_data:/data"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:{{ immich_port }}:2283"
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}"
    volumes:
      - immich_cache:/cache
    environment:
      TZ: "{{ immich_timezone }}"
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: "{{ immich_redis_image }}"
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: "{{ immich_database_image }}"
    environment:
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - "immich_database:/var/lib/postgresql/data"
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  immich_cache:
    name: immich_cache
  immich_data:
    name: immich_data
  immich_database:
    name: immich_database
