---
# Tasks to deploy Immich

- name: Deploy immich
  block:
    - name: Ensure Immich directory exists
      ansible.builtin.file:
        path: "{{ immich_data_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "{{ immich_data_dir }}/docker-compose.yml"
        mode: '0600'

    - name: Start Immich service
      community.docker.docker_compose_v2:
        project_src: "{{ immich_data_dir }}"
        state: present
        pull: always
      when: not ansible_check_mode

    - name: Append Immich to Tailscale services
      # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        tailscale_serve_services: "{{ tailscale_serve_services | combine({immich_ts_service: immich_port}) }}"
