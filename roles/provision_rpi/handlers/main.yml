---
# Handlers for provision_rpi role

- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
  when: not ansible_check_mode

- name: Restart zramswap
  ansible.builtin.systemd_service:
    name: zramswap
    state: restarted
    enabled: true
  when: not ansible_check_mode

