---
services:
  actual_server:
    image: "{{ actual_budget_image }}"
    container_name: actual-budget
    ports:
      - '{{ actual_budget_port }}:5006'
    environment:
      - ACTUAL_HTTPS_KEY=/data/selfhost.key
      - ACTUAL_HTTPS_CERT=/data/selfhost.crt
    volumes:
      - actual_budget_data:/data
      - "{{ https_crt_path }}:/data/selfhost.crt:ro"
      - "{{ https_key_path }}:/data/selfhost.key:ro"
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  actual_budget_data:
    name: actual_budget_data
