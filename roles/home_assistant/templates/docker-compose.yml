---

# https://www.home-assistant.io/installation/linux#docker-compose

services:
  home-assistant:
    container_name: home-assistant
    image: "{{ home_assistant_image }}"
    volumes:
      - home_assistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    # privileged: true  # Docs suggest, but is a security concern. Enable if issues finding HW
    network_mode: host  # This is also a security concern, but is required for mDNS and othwerwise I would need to forward hella ports for each new device I want to connect
    cap_add:
      - NET_ADMIN  # Needed for full bluetooth capabilities
      - NET_RAW  # Needed for full bluetooth capabilities

    environment:
      TZ: America/New_York

  whisper:
    container_name: home-assistant-whisper
    image: "{{ home_assistant_whisper_image }}"
    command: --model {{ home_assistant_whisper_model }} --language {{ home_assistant_whisper_language }}
    volumes:
      - home_assistant_whisper_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:{{ home_assistant_whisper_port }}:10300"
    restart: unless-stopped
    environment:
      TZ: America/New_York

  piper:
    container_name: home-assistant-piper
    image: "{{ home_assistant_piper_image }}"
    command: --voice {{ home_assistant_piper_voice }}
    volumes:
      - home_assistant_piper_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:{{ home_assistant_piper_port }}:10200"
    restart: unless-stopped
    environment:
      TZ: America/New_York

  music-assistant:
    container_name: home-assistant-music-assistant
    image: "{{ home_assistant_music_assistant_image }}"
    network_mode: host
    volumes:
      - home_assistant_music_assistant_data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    environment:
      TZ: America/New_York

volumes:
  home_assistant_config:
    name: home_assistant_config
  home_assistant_whisper_data:
    name: home_assistant_whisper_data
  home_assistant_piper_data:
    name: home_assistant_piper_data
  home_assistant_music_assistant_data:
    name: home_assistant_music_assistant_data
