---
# Tasks to deploy home_assistant service

- name: Install and setup dbus-broker for better bluetooth support
  block:
    - name: Install dbus-broker package
      ansible.builtin.package:
        name: dbus-broker
        state: present
      register: home_assistant_dbus_broker_package
      notify: Reboot after dbus-broker installation

    - name: Enable and start dbus-broker service
      ansible.builtin.systemd:
        name: dbus-broker
        enabled: true
        state: started

- name: Set up MQTT broker for Home Assistant
  block:
    - name: Install Mosquitto
      ansible.builtin.package:
        name:
          - mosquitto
        state: present

    - name: Create Mosquitto password file
      ansible.builtin.command:
        argv:
          - mosquitto_passwd
          - -c
          - /etc/mosquitto/passwd
          - "{{ home_assistant_mqtt_username }}"
        stdin: "{{ home_assistant_mqtt_password }}\n{{ home_assistant_mqtt_password }}\n"
        creates: /etc/mosquitto/passwd
      no_log: true
      notify: Restart Mosquitto

    - name: Set Mosquitto password file permissions
      ansible.builtin.file:
        path: /etc/mosquitto/passwd
        owner: root
        group: mosquitto
        mode: '0640'

    - name: Configure Mosquitto for Home Assistant
      ansible.builtin.template:
        src: mosquitto.conf
        dest: /etc/mosquitto/conf.d/home-assistant.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Mosquitto

    - name: Allow MQTT from the local subnet
      community.general.ufw:
        rule: allow
        port: '1883'
        proto: tcp
        src: 10.0.0.0/24

    - name: Allow configured Home Assistant UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
        src: "{{ home_assistant_ufw_src }}"
      loop: "{{ home_assistant_ufw_ports }}"

    - name: Enable and start Mosquitto
      ansible.builtin.systemd:
        name: mosquitto
        enabled: true
        state: started

- name: Deploy home_assistant
  block:
    - name: Ensure Compose project directory exists
      ansible.builtin.file:
        path: "{{ home_assistant_data_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "{{ home_assistant_data_dir }}/docker-compose.yml"
        mode: '0600'

    - name: Start home_assistant service
      community.docker.docker_compose_v2:
        project_src: "{{ home_assistant_data_dir }}"
        state: present
        pull: always
      check_mode: false

    - name: Check whether HACS is installed
      community.docker.docker_container_exec:
        container: home-assistant
        argv:
          - test
          - -f
          - /config/custom_components/hacs/manifest.json
      register: home_assistant_hacs_check
      changed_when: false
      failed_when: home_assistant_hacs_check.rc not in [0, 1]
      when: not ansible_check_mode

    - name: Install HACS
      community.docker.docker_container_exec:
        container: home-assistant
        chdir: /config
        argv:
          - bash
          - -c
          - wget -O - https://get.hacs.xyz | bash -
      when: not ansible_check_mode and home_assistant_hacs_check.rc == 1
      changed_when: true
      notify: Restart Home Assistant

    - name: Append Home Assistant to Tailscale services
      # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        tailscale_serve_services: "{{ tailscale_serve_services | combine({home_assistant_ts_service: home_assistant_port}) }}"
