---
# Tasks to deploy frigate service

- name: Deploy frigate
  block:
    - name: Ensure Compose project directory exists
      ansible.builtin.file:
        path: "{{ frigate_data_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "{{ frigate_data_dir }}/docker-compose.yml"
        mode: '0600'
      register: frigate_compose_template

    - name: Start frigate service
      community.docker.docker_compose_v2:
        project_src: "{{ frigate_data_dir }}"
        state: present
        # pull: always  # Disable if there is not much space on the host, as this will pull the image every time the playbook is run
      when: not ansible_check_mode

    - name: Append Frigate to Tailscale services
      # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        tailscale_serve_services: "{{ tailscale_serve_services | combine({frigate_ts_service: {'/': 'https+insecure://127.0.0.1:' ~ frigate_port_gui|string}}) }}"
