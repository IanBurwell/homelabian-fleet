---
services:
  frigate:
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    image: "{{ frigate_image }}"
    shm_size: "{{ frigate_shm_size }}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - type: bind
        source: "{{ frigate_storage_dir }}"
        target: /media/frigate
      - type: bind
        source: "{{ https_crt_path }}"
        target: /etc/letsencrypt/live/frigate/fullchain.pem
        read_only: true
      - type: bind
        source: "{{ https_key_path }}"
        target: /etc/letsencrypt/live/frigate/privkey.pem
        read_only: true
      - type: tmpfs # 1GB In-memory filesystem for recording segment storage
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    # TODO: optimize for intel CPU
    # devices:
    #   - /dev/video11:/dev/video11 # RPi 4B video hardware decoder (?)
    ports:
      - "{{ frigate_port_gui }}:8971"
      - "{{ frigate_port_rtsp }}:8554"
      - "{{ frigate_port_webrtc_tcp }}:8555/tcp"
      - "{{ frigate_port_webrtc_udp }}:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: "{{ frigate_rtsp_pw }}"
