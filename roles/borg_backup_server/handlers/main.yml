---
# Handlers for borg_backup_server role

- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: false
  when: not ansible_check_mode

- name: Apply hdparm spindown timer
  ansible.builtin.command:
    cmd: "hdparm -S {{ borg_backup_server_spindown_time }} -y {{ borg_backup_server_device }}"
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Restart smartmontools
  ansible.builtin.systemd_service:
    name: smartmontools
    state: restarted
    enabled: true
  when: not ansible_check_mode

- name: Restart backup-status
  ansible.builtin.systemd_service:
    name: backup-status
    state: restarted
    daemon_reload: true
    enabled: true
  when: not ansible_check_mode
