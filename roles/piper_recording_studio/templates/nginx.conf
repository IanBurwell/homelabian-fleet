server_tokens off;
limit_req_zone $binary_remote_addr zone=piper_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=piper_conn:10m;

server {
    listen 8080;
    client_max_body_size 10m;

    limit_req zone=piper_req burst=30 nodelay;
    limit_req_status 429;
    limit_conn piper_conn 20;
    limit_conn_status 429;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    auth_basic "Piper Recording Studio";
    auth_basic_user_file /etc/nginx/.htpasswd;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location / {
        proxy_pass http://piper-recording-studio:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
